[project]
name = "dexter-core"
version = "0.1.0"
description = "Local-first data engineering platform foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "databricks-sdk==0.158.0",
  "azure-identity==1.27.0",
  "httpx==0.28.1",
  "pyarrow==26.0.0",
  "duckdb==1.5.6",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
